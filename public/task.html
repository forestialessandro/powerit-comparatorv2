<script>
(function(){
  var DASHBOARD="https://claude.ai/artifact/RN2zADUvzsQqe4FwLs2ctK";
  /* Aperta dall'icona in Home (URL con ?go=1): vai subito alla dashboard. */
  if(/[?&]go=1(&|$)/.test(location.search)){location.replace(DASHBOARD);return;}
  /* Aperta a mano: resta su questa pagina per "Aggiungi alla schermata Home",
     ma imposta gia' l'URL con ?go=1 cosi' la scorciatoia creata apre la dashboard. */

})();
</script>
